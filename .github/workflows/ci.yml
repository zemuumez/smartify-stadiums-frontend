name: CI

on:
  push:
    branches: [main, 'codex/**', 'feature/**']
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Test, Build & Browser Journeys
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Verify Scoped Lint
        run: npm run lint:scoped

      - name: Run Unit & Integration Tests
        run: npm test

      - name: Build Production Application Bundle
        run: npm run build
        env:
          NEXT_PUBLIC_APP_ENV: test

      - name: Run All 5 E2E Browser Suites & Accessibility Verification
        run: node tests/run-all-e2e.mjs
        env:
          CHROME_BIN: /usr/bin/google-chrome
          ARTIFACT_DIR: .test-artifacts
          NEXT_PUBLIC_APP_ENV: test

      - name: Upload Test & Failure Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: frontend/.test-artifacts
          retention-days: 14
